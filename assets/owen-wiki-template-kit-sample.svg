<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Owen-WIKI Template Kit sample image</title>
  <desc id="desc">Owen-WIKI Template Kit turns raw sources into wiki pages, ontology, and outputs inside an Obsidian-centered knowledge workflow.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.52" stop-color="#f2f7fb"/>
      <stop offset="1" stop-color="#edf8f3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#f8fbff" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="liquidShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.93"/>
      <stop offset="0.44" stop-color="#fbfdff" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#eef8f5" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="liquidPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.48" stop-color="#fbfdff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#f3f9fc" stop-opacity="0.64"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.34" stop-color="#b8c9dc"/>
      <stop offset="1" stop-color="#d9e5ef"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#f7fbff" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="activeSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#dff3ff"/>
    </linearGradient>
    <linearGradient id="activeMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="activeViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#334155" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.68"/>
    </filter>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#475569" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.72"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c8da5"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; letter-spacing: 0; }
      .eyebrow { font-size: 15px; font-weight: 800; fill: #506078; }
      .title { font-size: 44px; font-weight: 900; }
      .subtitle { font-size: 17px; font-weight: 650; fill: #536177; }
      .sectionTitle { font-size: 18px; font-weight: 900; }
      .smallTitle { font-size: 13px; font-weight: 900; fill: #334155; }
      .label { font-size: 12px; font-weight: 850; fill: #475569; }
      .tiny { font-size: 10.5px; font-weight: 800; fill: #64748b; }
      .mono { font-size: 12px; font-weight: 850; fill: #334155; }
      .body { font-size: 13.5px; font-weight: 750; fill: #44546a; }
      .glass { fill: url(#liquidShell); stroke: url(#rimStroke); stroke-width: 1.35; }
      .panel { fill: url(#liquidPanel); stroke: #bdccdc; stroke-width: 1.2; }
      .chip { fill: url(#liquidPanel); stroke: #c6d4e3; stroke-width: 1.1; }
      .line { stroke: #d9e4ef; stroke-width: 2; stroke-linecap: round; }
      .thinLine { stroke: #e4edf5; stroke-width: 1.3; stroke-linecap: round; }
      .flow { stroke: #7c8da5; stroke-width: 2.3; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
      .gloss { fill: none; stroke: #ffffff; stroke-opacity: 0.92; stroke-width: 1.7; }
      .reflection { fill: url(#reflection); opacity: 0.72; }
      .nodeText { font-size: 10px; font-weight: 900; fill: #334155; }
    </style>
  </defs>

  <rect width="1440" height="810" fill="url(#pageBg)"/>
  <rect x="28" y="28" width="1384" height="754" rx="24" class="glass"/>
  <rect x="49" y="48" width="1342" height="150" rx="20" class="reflection"/>
  <path d="M63 48 C242 31 430 43 585 54" class="gloss"/>
  <path d="M818 47 C980 31 1190 38 1368 60" class="gloss"/>


      <path d="M64 0 L86 22 L64 22 Z" fill="#e8f1fb"/>
      <rect x="17" y="27" width="48" height="8" rx="4" fill="#bae6fd"/>
      <rect x="17" y="49" width="52" height="6" rx="3" fill="#dbe4ef"/>
